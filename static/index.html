<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绒光公社</title>
<style>
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --text: #1d1d1f;
  --secondary: #86868b;
  --accent: #4A7C59;
  --accent-light: #e8f5e9;
  --border: #e5e5e7;
  --shadow: 0 1px 3px rgba(0,0,0,.04), 0 1px 2px rgba(0,0,0,.06);
  --shadow-lg: 0 4px 12px rgba(0,0,0,.06), 0 2px 4px rgba(0,0,0,.04);
  --radius: 16px;
  --radius-sm: 10px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: var(--bg); color: var(--text); line-height: 1.6;
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}

/* Nav */
nav {
  position: sticky; top: 0; z-index: 100;
  background: rgba(245,245,247,.82); backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 0 24px; display: flex; align-items: center; justify-content: center;
  height: 52px;
}
nav .logo { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -.3px; position: absolute; left: 24px; }
nav .tabs { display: flex; gap: 4px; }
nav .tab {
  padding: 8px 18px; border-radius: 8px; cursor: pointer;
  font-size: 14px; font-weight: 500; color: var(--text); transition: all .2s;
  border: none; background: none;
}
nav .tab:hover { background: rgba(0,0,0,.04); }
nav .tab.active { background: rgba(0,0,0,.08); color: var(--accent); font-weight: 600; }

/* Layout */
main { max-width: 1040px; margin: 0 auto; padding: 40px 24px 80px; }

/* Hero */
.hero { text-align: center; padding: 60px 0 48px; }
.hero h1 { font-size: 48px; font-weight: 700; letter-spacing: -1px; color: var(--text); margin-bottom: 8px; }
.hero p { font-size: 19px; color: var(--secondary); font-weight: 400; }

/* Stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 48px; }
.stat-card {
  background: var(--card); border-radius: var(--radius); padding: 24px;
  box-shadow: var(--shadow); transition: all .3s;
}
.stat-card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.stat-card .label { font-size: 13px; color: var(--secondary); text-transform: uppercase; letter-spacing: .5px; margin-bottom: 8px; }
.stat-card .value { font-size: 36px; font-weight: 700; letter-spacing: -1px; color: var(--text); }
.stat-card .unit { font-size: 16px; font-weight: 400; color: var(--secondary); }
.stat-card .icon { font-size: 28px; margin-bottom: 12px; }

/* Cards grid */
.section-title { font-size: 24px; font-weight: 700; margin-bottom: 16px; letter-spacing: -.5px; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 16px; }
.card {
  background: var(--card); border-radius: var(--radius); padding: 20px;
  box-shadow: var(--shadow); transition: all .3s; cursor: pointer;
}
.card:hover { box-shadow: var(--shadow-lg); transform: translateY(-2px); }
.card .name { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
.card .meta { font-size: 13px; color: var(--secondary); margin-bottom: 8px; }
.card .price { font-size: 20px; font-weight: 700; color: var(--text); }
.card .status {
  display: inline-block; padding: 3px 10px; border-radius: 20px;
  font-size: 12px; font-weight: 600; margin-top: 8px;
}
.status.available { background: var(--accent-light); color: var(--accent); }
.status.adopted { background: #fff3e0; color: #e65100; }
.status.active { background: var(--accent-light); color: var(--accent); }

/* List */
.list { display: flex; flex-direction: column; gap: 8px; }
.list-item {
  background: var(--card); border-radius: var(--radius-sm); padding: 16px 20px;
  box-shadow: var(--shadow); display: flex; align-items: center; justify-content: space-between;
}
.list-item .left { display: flex; flex-direction: column; gap: 2px; }
.list-item .title { font-weight: 600; font-size: 15px; }
.list-item .sub { font-size: 13px; color: var(--secondary); }

/* Trace */
.trace-timeline { display: flex; flex-direction: column; gap: 0; margin-top: 16px; }
.trace-node {
  display: flex; gap: 16px; padding: 16px 0; position: relative;
}
.trace-node::before {
  content: ''; position: absolute; left: 11px; top: 40px; bottom: 0;
  width: 2px; background: var(--border);
}
.trace-node:last-child::before { display: none; }
.trace-dot {
  width: 24px; height: 24px; border-radius: 50%; background: var(--accent);
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  color: #fff; font-size: 12px; font-weight: 700;
}
.trace-content .stage-name { font-weight: 600; font-size: 15px; }
.trace-content .stage-detail { font-size: 13px; color: var(--secondary); }

/* Buttons & Inputs */
.btn {
  padding: 10px 24px; border-radius: 24px; font-size: 14px; font-weight: 600;
  border: none; cursor: pointer; transition: all .2s; background: var(--accent);
  color: #fff; letter-spacing: -.2px;
}
.btn:hover { opacity: .88; transform: scale(1.02); }
.btn:active { transform: scale(.98); }
.btn-outline { background: var(--card); color: var(--accent); border: 1.5px solid var(--accent); }
.btn-sm { padding: 6px 16px; font-size: 13px; }

input {
  padding: 12px 16px; border-radius: var(--radius-sm); border: 1.5px solid var(--border);
  font-size: 15px; outline: none; transition: border .2s; width: 100%;
  font-family: inherit; background: var(--card);
}
input:focus { border-color: var(--accent); }

.search-bar { display: flex; gap: 10px; margin-bottom: 24px; max-width: 420px; }

/* Modal */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 200;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
}
.modal {
  background: var(--card); border-radius: 20px; padding: 32px; max-width: 440px;
  width: 90%; box-shadow: 0 20px 60px rgba(0,0,0,.15);
}
.modal h3 { font-size: 20px; font-weight: 700; margin-bottom: 20px; }
.modal .field { margin-bottom: 14px; }
.modal .field label { font-size: 13px; font-weight: 600; color: var(--secondary); display: block; margin-bottom: 4px; }
.modal .actions { display: flex; gap: 10px; margin-top: 20px; justify-content: flex-end; }

/* Empty & Loading */
.empty { text-align: center; padding: 60px 20px; color: var(--secondary); }
.empty .icon { font-size: 48px; margin-bottom: 12px; }
.loading { text-align: center; padding: 40px; color: var(--secondary); }
.pulse {
  display: inline-block; width: 8px; height: 8px; border-radius: 50%;
  background: var(--accent); animation: pulse 1.5s ease-in-out infinite;
}
@keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.3} }

/* Responsive */
@media (max-width: 768px) {
  .hero h1 { font-size: 32px; }
  .stats { grid-template-columns: 1fr; }
  .grid { grid-template-columns: 1fr; }
  nav .logo { position: static; margin-right: auto; }
  nav { justify-content: flex-start; }
}
</style>
</head>
<body>

<nav>
  <span class="logo">绒光公社</span>
  <div class="tabs">
    <button class="tab active" data-page="home">首页</button>
    <button class="tab" data-page="sheep">羊只</button>
    <button class="tab" data-page="adoptions">认养</button>
    <button class="tab" data-page="trace">溯源</button>
  </div>
</nav>

<main id="app"></main>

<!-- Adoption Modal -->
<div id="modal" class="modal-overlay" style="display:none">
  <div class="modal">
    <h3>认养申请</h3>
    <div class="field"><label>羊只</label><input id="m-sheep" readonly /></div>
    <div class="field"><label>姓名</label><input id="m-name" placeholder="您的姓名" /></div>
    <div class="field"><label>手机号</label><input id="m-phone" placeholder="11位手机号" type="tel" /></div>
    <div class="field"><label>收货地址</label><input id="m-addr" placeholder="详细收货地址" /></div>
    <div class="actions">
      <button class="btn btn-outline" onclick="closeModal()">取消</button>
      <button class="btn" onclick="submitAdoption()">确认认养</button>
    </div>
  </div>
</div>

<script>
const API = '';
let currentPage = 'home';
let modalSheepId = '';

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentPage = t.dataset.page;
    render();
  });
});

function closeModal() { document.getElementById('modal').style.display = 'none'; }

async function submitAdoption() {
  const name = document.getElementById('m-name').value.trim();
  const phone = document.getElementById('m-phone').value.trim();
  const addr = document.getElementById('m-addr').value.trim();
  if (!name || !phone || !addr) return alert('请填写完整信息');
  if (!/^1[3-9]\d{9}$/.test(phone)) return alert('手机号格式不正确');

  const res = await fetch(API + '/api/adoption/apply', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({sheep_id: modalSheepId, adopter_name: name, adopter_phone: phone, adopter_address: addr})
  });
  if (res.ok) {
    closeModal();
    alert('认养成功！工作人员将在24小时内与您联系。');
    render();
  } else {
    const e = await res.json();
    alert(e.detail || '认养失败');
  }
}

async function fetchJSON(url, opts) {
  const res = await fetch(API + url, opts);
  if (!res.ok) throw new Error(res.status);
  return res.json();
}

async function render() {
  const app = document.getElementById('app');
  try {
    switch (currentPage) {
      case 'home': app.innerHTML = await renderHome(); break;
      case 'sheep': app.innerHTML = await renderSheep(); break;
      case 'adoptions': app.innerHTML = await renderAdoptions(); break;
      case 'trace': app.innerHTML = renderTrace(); break;
    }
  } catch (e) {
    app.innerHTML = `<div class="empty"><div class="icon">⚠</div><p>加载失败，请确认后端是否启动</p></div>`;
  }
  rebindEvents();
}

async function renderHome() {
  const [sheep, adoptions] = await Promise.all([
    fetchJSON('/api/sheep/list').catch(() => []),
    fetchJSON('/api/adoption/list').catch(() => []),
  ]);
  const adopted = sheep.filter(s => s.status === 'adopted').length;
  const totalCarbon = (adopted * 0.554).toFixed(1);

  return `
    <div class="hero">
      <h1>绒光公社</h1>
      <p>AIoT + ESG 赋能的治愈系数字牧场</p>
    </div>
    <div class="stats">
      <div class="stat-card">
        <div class="icon">🐑</div>
        <div class="label">牧场羊只总数</div>
        <div class="value">${sheep.length}<span class="unit"> 只</span></div>
      </div>
      <div class="stat-card">
        <div class="icon">🤝</div>
        <div class="label">已认养</div>
        <div class="value">${adopted}<span class="unit"> 只</span></div>
      </div>
      <div class="stat-card">
        <div class="icon">🌱</div>
        <div class="label">累计碳汇</div>
        <div class="value">${totalCarbon}<span class="unit"> tCO₂</span></div>
      </div>
    </div>
    <div class="section-title">可认养羊只</div>
    <div class="grid">
      ${sheep.filter(s => s.status === 'available').slice(0, 6).map(s => `
        <div class="card" data-sid="${s.sheep_id}">
          <div class="name">${esc(s.name)}</div>
          <div class="meta">${esc(s.breed)} · ${esc(s.ranch_id)}</div>
          <div class="price">¥${s.price.toLocaleString()}</div>
          <span class="status available">可认养</span>
        </div>
      `).join('')}
      ${sheep.filter(s => s.status === 'available').length === 0 ? '<div class="empty"><p>暂无可用羊只</p></div>' : ''}
    </div>`;
}

async function renderSheep() {
  const sheep = await fetchJSON('/api/sheep/list').catch(() => []);
  const available = sheep.filter(s => s.status === 'available');
  const adopted = sheep.filter(s => s.status === 'adopted');
  return `
    <div class="section-title">可认养 (${available.length})</div>
    <div class="grid" style="margin-bottom:40px">
      ${available.map(s => `
        <div class="card" data-sid="${s.sheep_id}">
          <div class="name">${esc(s.name)}</div>
          <div class="meta">${esc(s.breed)} · ${esc(s.ranch_id)}</div>
          <div class="price">¥${s.price.toLocaleString()}</div>
          <span class="status available">可认养</span>
        </div>
      `).join('')}
      ${available.length === 0 ? '<div class="empty"><p>暂无</p></div>' : ''}
    </div>
    <div class="section-title">已认养 (${adopted.length})</div>
    <div class="grid">
      ${adopted.map(s => `
        <div class="card" style="cursor:default;opacity:.85">
          <div class="name">${esc(s.name)}</div>
          <div class="meta">${esc(s.breed)}</div>
          <div class="price">¥${s.price.toLocaleString()}</div>
          <span class="status adopted">已认养</span>
        </div>
      `).join('')}
      ${adopted.length === 0 ? '<div class="empty"><p>暂无</p></div>' : ''}
    </div>`;
}

async function renderAdoptions() {
  const ads = await fetchJSON('/api/adoption/list').catch(() => []);
  return `
    <div class="section-title">认养记录 (${ads.length})</div>
    ${ads.length === 0 ? '<div class="empty"><div class="icon">📋</div><p>还没有认养记录</p></div>' : `
    <div class="list">
      ${ads.map(a => `
        <div class="list-item">
          <div class="left">
            <span class="title">${esc(a.adoption_id)}</span>
            <span class="sub">羊只: ${esc(a.sheep_id)} · ${esc(a.adopter_name)} · ${esc(a.adopter_phone)}</span>
          </div>
          <span class="status active">${esc(a.status)}</span>
        </div>
      `).join('')}
    </div>`}`;
}

function renderTrace() {
  return `
    <div class="section-title">溯源查询</div>
    <div class="search-bar">
      <input id="trace-input" placeholder="输入羊只ID (如 RG-SH-...)" />
      <button class="btn" id="trace-btn">查询</button>
    </div>
    <div id="trace-result"></div>`;
}

async function doTrace() {
  const sid = document.getElementById('trace-input').value.trim();
  const container = document.getElementById('trace-result');
  if (!sid) { container.innerHTML = ''; return; }
  container.innerHTML = '<div class="loading"><span class="pulse"></span> 查询中...</div>';
  try {
    const data = await fetchJSON('/api/trace/' + sid);
    if (!data.stages || data.stages.length === 0) {
      container.innerHTML = '<div class="empty"><p>该羊只暂无溯源记录</p></div>';
      return;
    }
    container.innerHTML = `
      <p style="color:var(--secondary);margin-bottom:12px">${esc(data.sheep_id)} · 共 ${data.stages.length} 个阶段</p>
      <div class="trace-timeline">
        ${data.stages.map((s, i) => `
          <div class="trace-node">
            <div class="trace-dot">${i+1}</div>
            <div class="trace-content">
              <div class="stage-name">${stageName(s.stage)} — ${esc(s.location)}</div>
              <div class="stage-detail">操作人: ${esc(s.operator)} · ${esc(s.timestamp || '')}</div>
            </div>
          </div>
        `).join('')}
      </div>`;
  } catch (e) {
    container.innerHTML = '<div class="empty"><p>查询失败</p></div>';
  }
}

function stageName(s) {
  const map = {breeding:'养殖', feeding:'喂养', processing:'加工', logistics:'物流', delivery:'配送'};
  return map[s] || s;
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function rebindEvents() {
  document.querySelectorAll('.card[data-sid]').forEach(c => {
    c.addEventListener('click', () => { modalSheepId = c.dataset.sid; openAdoptModal(c.dataset.sid); });
  });
  const tb = document.getElementById('trace-btn');
  if (tb) tb.addEventListener('click', doTrace);
}

async function openAdoptModal(sid) {
  const sheep = await fetchJSON('/api/sheep/' + sid).catch(() => null);
  if (!sheep || sheep.status !== 'available') { alert('该羊只不可认养'); return; }
  document.getElementById('m-sheep').value = sheep.name + ' — ' + sheep.sheep_id;
  document.getElementById('m-name').value = '';
  document.getElementById('m-phone').value = '';
  document.getElementById('m-addr').value = '';
  document.getElementById('modal').style.display = 'flex';
}

render();
</script>
</body>
</html>
